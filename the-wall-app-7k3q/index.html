<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: the same gallery-white catalogue as the feasibility study. Three surfaces share one header:
   the visitor's QR page (a phone-width plate), the artist portal, and the admin console (sidebar + work area). */
:root{
  --paper:#FAFAF7; --wall:#F1EEE8; --card:#FFFFFF;
  --ink:#1C1B19; --ink-2:#55524B; --ink-3:#8A867C; --rule:#E4E1D9; --rule-2:#CFCBC0;
  --gold:#8C6A2B; --gold-fill:#C49A4A; --gold-tint:rgba(196,154,74,.13);
  --tint:#F1EEE8; --deep:#1C1B19; --mid:#C49A4A; --frame:#1C1B19; --mat:#FFFFFF; --scrim:rgba(28,27,25,.5);
  --good:#2E7A4B; --bad:#B0473A; --warn:#9A6A12; color-scheme:light;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html[lang="ar"]{
  --f-display:"Noto Naskh Arabic","Newsreader",Georgia,serif;
  --f-body:"IBM Plex Sans Arabic","Hanken Grotesk",Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:40}
a{color:var(--gold)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
bdi{unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1;letter-spacing:-.01em;margin-inline-end:auto;color:var(--ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.brand em{font-style:italic;color:var(--gold)}
.surfaces{display:flex;gap:0;border:1px solid var(--rule-2);order:3;flex:1 1 100%;max-width:100%}
.surfaces button{flex:1;appearance:none;background:transparent;border:0;padding:9px 10px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.surfaces button + button{border-inline-start:1px solid var(--rule-2)}
.surfaces button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.lang{appearance:none;border:1px solid var(--rule-2);background:var(--card);color:var(--ink);padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
@media(min-width:760px){.surfaces{order:0;flex:0 1 auto}.surfaces button{padding:8px 18px}}

/* type */
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:clamp(38px,6.4vw,76px);line-height:.98;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--gold)}
html[lang="ar"] h1{line-height:1.25;letter-spacing:0}
h2{font-size:clamp(26px,3.4vw,38px);line-height:1.1}
h3{font-size:22px;line-height:1.2}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
html[lang="ar"] .kicker,html[lang="ar"] .chip,html[lang="ar"] th{letter-spacing:0;text-transform:none}
.lede{font-family:var(--f-display);font-size:21px;line-height:1.4;color:var(--ink);margin:0;max-width:52ch;text-wrap:pretty}
p{margin:0}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3);font-size:13px}
.stack{display:grid;gap:18px;min-width:0}.stack>*{min-width:0}
.row{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hd{display:flex;gap:12px;align-items:center;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 0}
.hd::after{content:"";flex:1;height:1px;background:var(--rule)}
html[lang="ar"] .hd{letter-spacing:0;text-transform:none;font-family:var(--f-body);font-size:14px;font-weight:600}

/* controls */
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 20px;font-weight:600;font-size:15px;cursor:pointer;border-radius:2px;text-align:center;text-decoration:none;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.gold{background:var(--gold-fill);border-color:var(--gold-fill);color:#1C1B19}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-2)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{appearance:none;background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.f{display:grid;gap:6px;min-width:0}
.f>label,.f>.lab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f small{color:var(--ink-3);font-size:12px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--rule-2);padding:10px 12px;border-radius:2px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--gold-fill)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--rule-2);background:var(--card);cursor:pointer}
.opt:has(input:checked){border-color:var(--gold);background:var(--gold-tint)}
.opt b{display:block;font-weight:600}.opt span{font-size:13px;color:var(--ink-2)}
.opts{display:grid;gap:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.err{color:var(--bad);font-size:13.5px;border-inline-start:2px solid var(--bad);padding-inline-start:10px}
.note{font-size:13.5px;color:var(--ink-2);background:var(--gold-tint);padding:10px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{color:var(--good);border-color:currentColor}.chip.bad{color:var(--bad);border-color:currentColor}
.chip.warn{color:var(--warn);border-color:currentColor}.chip.gold{color:var(--gold);border-color:currentColor}

/* frames */
.frame{background:var(--frame);padding:7px;box-shadow:0 18px 28px -18px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.12)}
.frame .matt{background:var(--mat);padding:9%}
.frame img,.frame .ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.frame .ph{display:grid;place-items:center;font:italic 500 52px var(--f-display);color:rgba(28,27,25,.45)}
.frame.sm{padding:4px}.frame.sm .matt{padding:7%}.frame.sm .ph{font-size:26px}

/* visitor home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:end;padding-block:44px 28px}
.hero figure{margin:0;display:grid;gap:8px}
.hero img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--wall)}
.hero figcaption{font-size:12.5px;color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;counter-reset:s;border-top:1px solid var(--ink);padding-top:16px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;color:var(--ink-2)}
.steps li::before{content:counter(s);font:italic 500 22px/1 var(--f-display);color:var(--gold)}
.steps b{color:var(--ink)}
.exhibit{background:var(--wall);padding:34px 0 30px;margin-top:34px}
.exhibit .wrap{display:grid;gap:24px}
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:26px;align-items:start}
.work{margin:0;display:grid;gap:14px;min-width:0}
.work .framebtn{appearance:none;background:none;border:0;padding:0;cursor:pointer;text-align:start}
.wl{display:grid;gap:2px;font-size:12.5px;color:var(--ink-2);background:var(--card);padding:11px 12px;border:1px solid var(--rule);max-width:260px}
.wl b{font:italic 500 16px var(--f-display);color:var(--ink)}
.wl .pr{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);margin-top:5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.wl .scan{display:flex;gap:10px;align-items:center;margin-top:8px}
.qrbox{background:#fff;padding:4px;border:1px solid var(--rule);flex:none}
.qrbox svg{display:block;width:100%;height:auto}

/* QR page */
.phone{max-width:480px;margin-inline:auto;background:var(--paper)}

/* ---------- visual helpers ---------- */
const artSrc=a=>a&&(a.imgData||IMGS[a.img])||'';
function phStyle(a){const s=pick(a.title)||'x';let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return `background:linear-gradient(160deg,hsl(${h} 26% 80%),hsl(${(h+34)%360} 22% 64%))`}
function frame(a,cls){const src=artSrc(a);const inner=src?`<img src="${src}" alt="${esc(pick(a.title))}" loading="lazy">`:`<div class="ph" style="${phStyle(a)}"><span>${esc((pick(a.title)||'?').trim().charAt(0))}</span></div>`;return `<div class="frame ${cls||''}"><div class="matt">${inner}</div></div>`}
function qrSvg(text){
  try{
    if(typeof qrcode==='undefined')return '';
    const q=qrcode(0,'M');q.addData(text);q.make();let s=q.createSvgTag(3,0);
    s=s.replace(/<svg[^>]*>/,tag=>{let w=(tag.match(/width="(\d+)/)||[])[1],h=(tag.match(/height="(\d+)/)||[])[1];
      if(!/viewBox/.test(tag)&&w&&h)tag=tag.replace('<svg','<svg viewBox="0 0 '+w+' '+h+'"');
      return tag.replace(/ (width|height)="[^"]*"/g,'')});
    return s;
  }catch(e){return ''}
}
const qrUrl=code=>'thewall.art/q/'+code;
const qrBox=(code,px)=>{const s=qrSvg('https://'+qrUrl(code));return `<div class="qrbox" style="width:${px}px" title="${esc(qrUrl(code))}">${s||`<span class="mono" style="font-size:9px;color:#1C1B19;display:block;text-align:center;word-break:break-all">${esc(code)}</span>`}</div>`}
const mono=name=>`<span class="mono-av" aria-hidden="true">${esc((pick(name)||'?').trim().charAt(0))}</span>`;

/* ---------- painting tint: the page takes its colours from the artwork ---------- */
const TINT={};
function tintFor(a){return new Promise(res=>{
  if(!a){res(null);return}if(TINT[a.id]){res(TINT[a.id]);return}
  const src=artSrc(a);if(!src){res(null);return}
  const im=new Image();
  im.onload=()=>{try{
    const c=document.createElement('canvas');c.width=24;c.height=30;const x=c.getContext('2d');x.drawImage(im,0,0,24,30);
    const d=x.getImageData(0,0,24,30).data;let sx=0,sy=0,sw=0,sat=0,n=0;
    for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;
      const s=mx===mn?0:(mx-mn)/(1-Math.abs(2*l-1)||1);let h=0;
      if(mx!==mn){if(mx===r)h=((g-b)/(mx-mn))%6;else if(mx===g)h=(b-r)/(mx-mn)+2;else h=(r-g)/(mx-mn)+4;h*=60;if(h<0)h+=360}
      const w=s*s*(1-Math.abs(2*l-1)+.1);sx+=Math.cos(h*Math.PI/180)*w;sy+=Math.sin(h*Math.PI/180)*w;sw+=w;sat+=s;n++}
    let h=Math.atan2(sy,sx)*180/Math.PI;if(h<0)h+=360;
    res(TINT[a.id]={h:Math.round(h),s:Math.min(1,sat/n*1.6)});
  }catch(e){res(null)}};
  im.onerror=()=>res(null);im.src=src})}
function setTint(t){
  const r=document.documentElement.style;
  if(!t){['--tint','--deep','--mid'].forEach(k=>r.removeProperty(k));return}
  const s=Math.round(28+t.s*34);
  r.setProperty('--tint','hsl('+t.h+' '+Math.min(60,s)+'% 90%)');r.setProperty('--mid','hsl('+t.h+' '+Math.min(62,s+6)+'% 50%)');r.setProperty('--deep','hsl('+t.h+' '+Math.min(55,s)+'% 22%)');
}
function applyTint(){
  const el=$('[data-tint]');if(!el){setTint(null);return}
  const id=el.dataset.tint,a=artOf(id);
  tintFor(a).then(t=>{const cur=$('[data-tint]');if(cur&&cur.dataset.tint===id)setTint(t)});
}
/* ---------- toast / run ---------- */
let tt;
function toast(msg,kind){const t=$('#toast');t.innerHTML='<span></span>';t.firstChild.textContent=msg;t.className='show '+(kind||'');clearTimeout(tt);tt=setTimeout(()=>{t.className=''},3800)}
async function run(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){console.error(e);toast(L('Could not save. This view may be read-only.','تعذّر الحفظ. قد يكون هذا العرض للقراءة فقط.'),'bad');return false}}

/* ---------- router ---------- */
function parseHash(){
  let h='';try{h=(location.hash||'').slice(1)}catch(e){}
  if(!h)return;const i=h.indexOf('-');const a=i<0?h:h.slice(0,i),r=i<0?'':h.slice(i+1);
  if(a==='q'&&r){S.surface='visitor';S.v=Object.assign(S.v,{view:'qr',code:r})}
  else if(a==='wall'){S.surface='visitor';S.v=Object.assign(S.v,{view:'wall',code:null})}
  else if(a==='artist'){S.surface='artist';if(r)S.a.tab=r}
  else if(a==='admin'){S.surface='admin';if(r)S.m.tab=r}
}
function setHash(){
  const h=S.surface==='visitor'?(S.v.view==='qr'?'q-'+S.v.code:'wall'):S.surface==='artist'?'artist-'+S.a.tab:'admin-'+S.m.tab;
  try{if(location.hash!=='#'+h)history.replaceState(null,'','#'+h)}catch(e){}
}
function go(surface){S.surface=surface;render();window.scrollTo(0,0)}

/* ---------- render core ---------- */
let rq=0,pending=false;
function queueRender(){
  if(rq)return;
  rq=requestAnimationFrame(()=>{rq=0;const a=document.activeElement;
    if(a&&a.matches&&a.matches('#main input,#main textarea,#main select')){pending=true;return}
    render()});
}
document.addEventListener('focusout',()=>{if(!pending)return;setTimeout(()=>{const a=document.activeElement;
  if(!(a&&a.matches&&a.matches('#main input,#main textarea,#main select'))){pending=false;render()}},60)});

function header(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.body.classList.toggle('vis',S.surface==='visitor');
  const names=[['visitor',L('Visitor','زائر')],['artist',L('Artist','فنان')],['admin',L('Admin','إدارة')]];
  $('#surfaces').innerHTML=names.map(([k,n])=>`<button data-act="surface" data-s="${k}" aria-current="${S.surface===k}">${esc(n)}</button>`).join('');
  $('#lang').textContent=lang==='ar'?'EN':'ع';$('#lang').setAttribute('aria-label',lang==='ar'?'English':'العربية');
  $('#lang').setAttribute('lang',lang==='ar'?'en':'ar');
}
function render(){
  header();pending=false;

/* ---------- scan log + reservation sweep ---------- */
const scanned=new Set();
function logScan(pid){
  if(!db||!pid||scanned.has(pid))return;scanned.add(pid);
  W.set('scans/'+W.id('scans'),{placementId:pid,at:new Date().toISOString(),lang,device:'web'}).catch(()=>{});
}
const sweeping=new Set();
async function sweep(){
  const now=Date.now();
  for(const o of E(D.orders)){
    if(o.status==='reserved'&&o.expiresAt&&new Date(o.expiresAt).getTime()<now&&!sweeping.has(o.id)){
      sweeping.add(o.id);
      try{await W.upd('orders/'+o.id,{status:'expired'});
        const a=D.artworks[o.artworkId];if(a&&a.status==='reserved')await W.upd('artworks/'+o.artworkId,{status:'placed'});
      }catch(e){}
    }
  }
}

/* ---------- boot ---------- */
function onReady(){
  if(S.surface==='visitor'&&S.v.view==='qr'){const p=E(D.placements).find(p=>p.qr===S.v.code&&activeP(p));if(p)logScan(p.id)}
  sweep();
}
async function boot(){
  parseHash();render();
  const c=window.claude;
  db=c&&c.use?await c.use('db'):null;
  if(!db){noDb=true;render();return}
  NAMES.forEach(n=>{
    db.collection(n).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});D[n]=o;loaded[n]=true;
      if(n==='scans'){scanMap={};Object.values(o).forEach(s=>{scanMap[s.placementId]=(scanMap[s.placementId]||0)+1})}
      if(!ready&&NAMES.every(k=>loaded[k])){ready=true;onReady()}
      if(ready)sweep();
      queueRender();
    },err=>{if(!ready){errState=err&&err.code||'error';queueRender()}});
  });
}

ACT['form:checkout']=async(fd_)=>{

  const name=(fd_.get('name')||'').trim(),phone=(fd_.get('phone')||'').trim(),email=(fd_.get('email')||'').trim();
  const delivery=fd_.get('delivery')||'collect',address=(fd_.get('address')||'').trim();
  let err='';
  if(name.length<2)err=L('Enter your full name.','أدخل اسمك الكامل.');
  else if(!/^\+?[\d\s-]{8,}$/.test(phone))err=L('Enter a mobile number we can reach, for example +962 79 000 0000.','أدخل رقم جوال يمكننا الوصول إليه، مثل ‎+962 79 000 0000.');
  else if(email&&!/^\S+@\S+\.\S+$/.test(email))err=L('That email address looks incomplete.','يبدو أن البريد الإلكتروني غير مكتمل.');
  else if(buy&&delivery==='delivery'&&address.length<5)err=L('Add a delivery address, or choose to collect.','أضف عنوان التوصيل، أو اختر الاستلام من المكان.');
  else if(buy&&!fd_.get('terms'))err=L('Accept the buyer terms to continue.','وافق على شروط الشراء للمتابعة.');
  S.co.err=err;
  if(err){renderModal();return}
  S.co.busy=true;renderModal();
  try{
    await new Promise(r=>setTimeout(r,buy?900:300));
    const cur=await W.get('artworks/'+p.artworkId);
    if(!cur.exists||cur.data().status!=='placed'){S.co.busy=false;S.co.err=L('Sorry, this work was just taken. See what else is on the wall.','عذرًا، تم أخذ هذا العمل للتو. شاهد ما تبقّى على الجدار.');renderModal();return}
    const a=cur.data(),now=new Date();
    const nums=E(D.orders).map(o=>parseInt(String(o.no).split('-').pop(),10)||0);
    const no='TW-26-'+String(Math.max(40,...nums)+1).padStart(5,'0');
    const o={no,type:buy?'purchase':'reserve',artworkId:p.artworkId,placementId:p.id,artistId:a.artistId,venueId:p.venueId,price:a.price,currency:'JOD',
      buyer:{name,phone,email},delivery:buy?delivery:'collect',address:buy&&delivery==='delivery'?address:'',lang,
      createdAt:now.toISOString(),paidOut:{}};
    if(buy){Object.assign(o,{status:'paid',paidAt:now.toISOString(),payMethod:fd_.get('pay')||'card',rates:c.split,
      splits:{artist:Math.round(a.price*c.split.artist)/100,venue:Math.round(a.price*c.split.venue)/100,platform:Math.round(a.price*c.split.platform)/100}})}
    else Object.assign(o,{status:'reserved',expiresAt:new Date(now.getTime()+c.holdHours*3600000).toISOString(),rates:null,splits:null});
    const oid=W.id('orders');await W.set('orders/'+oid,o);LS.orders.unshift(oid);lsSave('orders');
    await W.upd('artworks/'+p.artworkId,{status:buy?'sold':'reserved'});
    S.co.order=o;S.co.step='done';S.co.busy=false;renderModal();
  }catch(e){
    console.error(e);S.co.busy=false;
    S.co.err=L('We could not complete this just now. Nothing was charged. Try again in a moment.','تعذّر إتمام العملية الآن. لم يُخصم أي مبلغ. حاول مجددًا بعد قليل.');renderModal();
  }
};

function readImage(file){
  const prev=$('#imgprev');if(!file){S.a.draftImg=null;if(prev)prev.innerHTML='';return}
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const m=820,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    let q=.78,u=c.toDataURL('image/jpeg',q);while(u.length>190000&&q>.35){q-=.1;u=c.toDataURL('image/jpeg',q)}
    S.a.draftImg=u;if(prev)prev.innerHTML=`<img src="${u}" alt="" style="max-height:140px;max-width:100%;display:block">`;
  };im.onerror=()=>toast(L('That file is not an image we can read.','لا يمكن قراءة هذا الملف كصورة.'),'bad');im.src=r.result};
  r.readAsDataURL(file);
}

    await log('Curator','Application '+dec+': '+pick(a.name),a.status,dec)},L('Decision saved.','حُفظ القرار.'));
};

  ${all.map(a=>`<tr><td><b>${esc(pick(a.title))}</b></td><td>${esc(pick((D.artists[a.artistId]||{}).name))}</td><td>${stChip(a.status)}</td><td class="n">${nf(a.price)}</td></tr>`).join('')}</tbody></table></div>`;

document.addEventListener('submit',e=>{const f=e.target.closest('[data-form="approve"]');if(f)f.dataset.decision=(e.submitter&&e.submitter.value)||''},true);
ACT['form:approve']=async(fdata,form)=>{

};

/* ----- exhibitions ----- */
function mEx(){
  const exs=E(D.exhibitions).sort((a,b)=>String(b.start).localeCompare(String(a.start)));
  if(!S.m.exId||!D.exhibitions[S.m.exId])S.m.exId=(exs[0]||{}).id;
  const ex=exs.find(e=>e.id===S.m.exId);
  const exChip=s=>chip({live:'good',draft:'warn',ended:''}[s]||'',{live:L('Live','مباشر'),draft:L('Draft','مسودة'),ended:L('Ended','انتهى')}[s]||s);
  let h=title(L('Curation','التنسيق'),L('Exhibitions','المعارض'),L('Pick a venue, hang available works on its walls, then take the exhibition live. Each wall keeps its QR code; only the artwork behind it changes.','اختر مكانًا وعلّق الأعمال الجاهزة على جدرانه ثم اجعل المعرض مباشرًا. يحتفظ كل جدار برمز QR الخاص به ويتغيّر العمل خلفه فقط.'));
  h+=`<div class="row">${exs.map(e=>`<button class="btn ${e.id===S.m.exId&&!S.m.newEx?'':'ghost'}" data-act="pickEx" data-id="${e.id}">${esc(pick((D.venues[e.venueId]||{}).name))} · ${esc(pick(e.theme))}</button>`).join('')}<button class="btn ghost" data-act="newEx">+ ${L('New exhibition','معرض جديد')}</button></div>`;
  if(S.m.newEx)h+=`<form class="card" data-form="newex" novalidate><h3>${L('New exhibition','معرض جديد')}</h3>
    <div class="f"><label for="nx-v">${L('Venue','المكان')}</label><select id="nx-v" name="venue">${E(D.venues).map(v=>`<option value="${v.id}">${esc(pick(v.name))}</option>`).join('')}</select></div>
    <div class="cols"><div class="f"><label for="nx-en">${L('Theme (English)','الموضوع (بالإنجليزية)')}</label><input id="nx-en" name="en"></div><div class="f"><label for="nx-ar">${L('Theme (Arabic)','الموضوع (بالعربية)')}</label><input id="nx-ar" name="ar" dir="rtl"></div></div>
    <div class="cols"><div class="f"><label for="nx-s">${L('Starts','يبدأ')}</label><input id="nx-s" name="start" type="date"></div><div class="f"><label for="nx-e">${L('Ends','ينتهي')}</label><input id="nx-e" name="end" type="date"></div></div>
    <p class="err" id="nx-err" role="alert" hidden></p><div><button class="btn">${L('Create draft','أنشئ مسودة')}</button></div></form>`;
  else if(ex){
    const v=D.venues[ex.venueId]||{},ps=E(D.placements).filter(p=>p.exhibitionId===ex.id);
    const taken=new Set(E(D.placements).filter(p=>!p.removedAt).map(p=>p.artworkId));
    const avail=E(D.artworks).filter(a=>a.status==='available'&&!taken.has(a.id));
    const liveElsewhere=E(D.exhibitions).find(e=>e.id!==ex.id&&e.venueId===ex.venueId&&e.status==='live');
    h+=`<div class="card"><div class="spread"><div><h3>${esc(pick(v.name))}</h3><p class="muted">${esc(pick(ex.theme))} · ${fd(ex.start)} – ${fd(ex.end)}</p></div>${exChip(ex.status)}</div>
    <div class="scroll"><table><thead><tr><th>${L('Wall','الجدار')}</th><th>${L('Size','المقاس')}</th><th>${L('QR','QR')}</th><th>${L('Artwork','العمل')}</th></tr></thead><tbody>
    ${(v.walls||[]).map(w=>{const p=ps.find(q=>q.wallId===w.id),a=p&&artOf(p.artworkId);
      return `<tr><td><b>${esc(pick(w.name))}</b></td><td class="n">${esc(w.size)}</td><td class="mono">${esc(w.qr)}</td><td>${a?`<div class="row" style="flex-wrap:nowrap"><span>${esc(pick(a.title))}</span>${ex.status==='draft'?`<button class="link" data-act="unhang" data-id="${p.id}">${L('Remove','أزل')}</button>`:''}</div>`:
        (ex.status==='draft'?(avail.length?`<div class="row" style="flex-wrap:nowrap"><select id="hang-${w.id}" aria-label="${L('Artwork for this wall','العمل لهذا الجدار')}">${avail.map(x=>`<option value="${x.id}">${esc(pick(x.title))} · ${esc(pick((D.artists[x.artistId]||{}).name))}</option>`).join('')}</select><button class="btn sm" data-act="hang" data-wall="${w.id}">${L('Hang','علّق')}</button></div>`:`<span class="faint">${L('No approved works free','لا أعمال معتمدة متاحة')}</span>`):'<span class="faint">—</span>')}</td></tr>`}).join('')}</tbody></table></div>
    ${liveElsewhere&&ex.status==='draft'?`<p class="note">${L('This venue already has a live exhibition. End it before taking this one live.','لهذا المكان معرض مباشر حاليًا. أنهِه قبل تشغيل هذا المعرض.')}</p>`:''}
    <div class="row">${ex.status==='draft'?`<button class="btn gold" data-act="goLive" data-id="${ex.id}" ${ps.length&&!liveElsewhere?'':'disabled'}>${L('Take live','شغّل المعرض')}</button>`:''}
    ${ex.status==='live'?`<button class="btn ghost" data-act="endEx" data-id="${ex.id}">${L('End exhibition','أنهِ المعرض')}</button>`:''}
    ${ex.status==='draft'?`<button class="btn danger" data-act="delEx" data-id="${ex.id}">${L('Delete draft','احذف المسودة')}</button>`:''}</div>
    ${ex.status==='live'?`<p class="faint">${L('Ending returns unsold works to “ready to hang”. Sold works stay with their buyers.','الإنهاء يعيد الأعمال غير المباعة إلى حالة «جاهزة للعرض». الأعمال المباعة تبقى لمشتريها.')}</p>`:''}</div>`;
  }
  return h;
}
ACT.pickEx=d=>{S.m.exId=d.id;S.m.newEx=false;render()};
ACT.newEx=()=>{S.m.newEx=!S.m.newEx;render()};
ACT['form:newex']=async(f)=>{const g=k=>(f.get(k)||'').trim(),er=$('#nx-err');
  if(!(g('en')||g('ar'))||!g('start')||!g('end')||g('end')<g('start')){er.textContent=L('Add a theme and a start date before the end date.','أضف موضوعًا وتاريخ بداية يسبق تاريخ النهاية.');er.hidden=false;return}
  const id=W.id('exhibitions');
  const ok=await run(async()=>{await W.set('exhibitions/'+id,{venueId:g('venue'),theme:{en:g('en')||g('ar'),ar:g('ar')||g('en')},start:g('start'),end:g('end'),status:'draft'});await log('Curator','Exhibition drafted: '+(g('en')||g('ar')),'','Draft')},L('Draft created.','أُنشئت المسودة.'));
  if(ok){S.m.exId=id;S.m.newEx=false;render()}};
ACT.hang=async d=>{
  const ex=D.exhibitions[S.m.exId],v=D.venues[ex.venueId],w=v.walls.find(x=>x.id===d.wall),sel=$('#hang-'+d.wall);if(!sel)return;
  await run(()=>W.set('placements/'+W.id('placements'),{artworkId:sel.value,venueId:ex.venueId,wallId:d.wall,exhibitionId:S.m.exId,qr:w.qr,installedAt:null,removedAt:null,baseScans:0}),L('Hung in the draft.','عُلّق في المسودة.'));
};
ACT.unhang=async d=>{await run(()=>W.del('placements/'+d.id))};
ACT.delEx=async d=>{await run(async()=>{for(const p of E(D.placements).filter(p=>p.exhibitionId===d.id))await W.del('placements/'+p.id);await W.del('exhibitions/'+d.id)},L('Draft deleted.','حُذفت المسودة.'));S.m.exId=null;render()};
ACT.goLive=async d=>{
  const ex=D.exhibitions[d.id],today=new Date().toISOString().slice(0,10);
  await run(async()=>{
    for(const p of E(D.placements).filter(p=>p.exhibitionId===d.id)){await W.upd('placements/'+p.id,{installedAt:today});await W.upd('artworks/'+p.artworkId,{status:'placed'})}
    await W.upd('exhibitions/'+d.id,{status:'live'});await log('Curator','Exhibition live: '+pick(ex.theme),'Draft','Live');
  },L('The exhibition is live. Its labels now open the QR pages.','المعرض مباشر الآن. ملصقاته تفتح صفحات QR.'));
};
ACT.endEx=async d=>{
  const ex=D.exhibitions[d.id],today=new Date().toISOString().slice(0,10);
  await run(async()=>{
    for(const p of E(D.placements).filter(p=>p.exhibitionId===d.id&&!p.removedAt)){await W.upd('placements/'+p.id,{removedAt:today});const a=D.artworks[p.artworkId];if(a&&(a.status==='placed'||a.status==='reserved')){await W.upd('artworks/'+p.artworkId,{status:'available'})}}
    for(const o of E(D.orders).filter(o=>o.status==='reserved'&&o.placementId&&D.placements[o.placementId]&&D.placements[o.placementId].exhibitionId===d.id))await W.upd('orders/'+o.id,{status:'expired'});
    await W.upd('exhibitions/'+d.id,{status:'ended'});await log('Curator','Exhibition ended: '+pick(ex.theme),'Live','Ended');
  },L('Exhibition ended. Unsold works are ready to hang again.','انتهى المعرض. الأعمال غير المباعة جاهزة للتعليق مجددًا.'));
};

}

/* ----- orders ----- */
function mOrders(){
  const t=Date.now();const all=E(D.orders).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const act=o=>o.status==='reserved'||needsHandover(o)||(o.status==='handed'&&eligibleAt(o)&&eligibleAt(o).getTime()<=t);
  const f=S.m.orderFilter,list=all.filter(o=>f==='all'?true:f==='action'?act(o):o.status===f);

  const o=S.m.orderId&&Object.assign({id:S.m.orderId},D.orders[S.m.orderId]);
  return title(L('Finance','المالية'),L('Orders','الطلبات'),L('Funds are held until handover plus the return window, then the order settles and the split posts.','تُحجز المبالغ حتى التسليم وفترة الإرجاع، ثم يُسوّى الطلب وتُسجَّل الحصص.'))+
  `<div class="f" style="max-width:260px"><label for="of">${L('Show','عرض')}</label><select id="of" data-change="orderFilter">${[['all',L('All orders','كل الطلبات')],['action',L('Needs an action','يحتاج إجراءً')],['reserved',L('Reserved','محجوزة')],['paid',L('Paid, funds held','مدفوعة')],['handed',L('Handed over','سُلّمت')],['settled',L('Settled','مُسوّاة')],['refunded',L('Refunded','مُستردة')]].map(x=>`<option value="${x[0]}" ${x[0]===f?'selected':''}>${x[1]}</option>`).join('')}</select></div>
  <div class="scroll"><table><thead><tr><th>${L('Order','الطلب')}</th><th>${L('Work','العمل')}</th><th>${L('Buyer','المشتري')}</th><th class="n">${L('Price','السعر')}</th><th>${L('Status','الحالة')}</th></tr></thead><tbody>
  ${list.map(x=>`<tr class="click ${x.id===S.m.orderId?'sel':''}" data-act="pickOrder" data-id="${x.id}"><td class="mono">${esc(x.no)}<br><span class="faint">${fd(x.createdAt)}</span></td><td>${esc(pick((D.artworks[x.artworkId]||{}).title))}</td><td>${esc(x.buyer.name)}</td><td class="n">${nf(x.price)}</td><td>${oChip(x.status)}</td></tr>`).join('')||`<tr><td colspan="5" class="muted">${L('No orders match.','لا طلبات مطابقة.')}</td></tr>`}</tbody></table></div>
  ${o?oDetail(o):''}`;
}
ACT.pickOrder=d=>{S.m.orderId=d.id;render();const el=$('#odetail');if(el)el.scrollIntoView({block:'nearest'})};
function oDetail(o){
  const a=artOf(o.artworkId)||{},ar=D.artists[o.artistId]||{},v=D.venues[o.venueId]||{},el=eligibleAt(o),ok=el&&el.getTime()<=Date.now();
  const buttons=[];
  if(o.status==='reserved')buttons.push(`<button class="btn" data-act="oConvert" data-id="${o.id}">${L('Payment received: mark as sold','تم استلام الدفع: سجّله مبيعًا')}</button>`,`<button class="btn ghost" data-act="oRelease" data-id="${o.id}">${L('Release the hold','أفرج عن الحجز')}</button>`);
  if(o.status==='paid')buttons.push(`<button class="btn" data-act="oHand" data-id="${o.id}">${L('Confirm handover','أكّد التسليم')}</button>`);
  if(o.status==='handed')buttons.push(`<button class="btn" data-act="oSettle" data-id="${o.id}" ${ok?'':'disabled'}>${L('Settle order','سوِّ الطلب')}</button>`,`<span class="faint">${ok?'':L('Return window ends','تنتهي فترة الإرجاع')+' '+fd(el)}</span>`,ok?'':`<button class="link" data-act="oSettle" data-id="${o.id}" data-early="1">${L('Settle early (demo)','سوِّ مبكرًا (تجربة)')}</button>`);
  if(['paid','handed'].includes(o.status))buttons.push(`<button class="btn danger" data-act="oRefund" data-id="${o.id}">${L('Refund','استرداد')}</button>`);
  const sp=o.splits;
  return `<div class="card" id="odetail"><div class="spread"><h3>${esc(o.no)}</h3>${oChip(o.status)}</div>
    <dl class="facts"><dt>${L('Work','العمل')}</dt><dd>${esc(pick(a.title))} · ${esc(pick(ar.name))}</dd><dt>${L('Venue','المكان')}</dt><dd>${esc(pick(v.name))}</dd><dt>${L('Buyer','المشتري')}</dt><dd>${esc(o.buyer.name)} · <bdi>${esc(o.buyer.phone)}</bdi>${o.buyer.email?' · '+esc(o.buyer.email):''}</dd>
    <dt>${L('Handover','التسليم')}</dt><dd>${o.delivery==='delivery'?L('Delivery to','توصيل إلى')+' '+esc(o.address):L('Collect at the venue','استلام من المكان')}</dd>
    ${o.payMethod?`<dt>${L('Paid with','الدفع')}</dt><dd>${esc(o.payMethod)} (${L('test','تجريبي')})</dd>`:''}
    ${o.expiresAt?`<dt>${L('Hold ends','ينتهي الحجز')}</dt><dd>${ft(o.expiresAt)}</dd>`:''}</dl>
    ${sp?`<div class="scroll"><table><thead><tr><th>${L('Split','الحصة')}</th><th class="n">%</th><th class="n">JOD</th><th>${L('Paid out','الدفع')}</th></tr></thead><tbody>
    ${[['artist',L('Artist','الفنان')],['venue',L('Venue','المكان')],['platform',L('The Wall','The Wall')]].map(([k,n])=>`<tr><td>${n}</td><td class="n">${(o.rates||{})[k]}</td><td class="n">${nf(sp[k])}</td><td>${k==='platform'?'—':(o.paidOut&&o.paidOut[k]?chip('good',L('Paid','مدفوع')):o.status==='settled'?chip('gold',L('Due','مستحق')):'—')}</td></tr>`).join('')}</tbody></table></div>`:''}
    <div class="row">${buttons.join('')}</div></div>`;
}
const O=async(id,patch,msg,okMsg,art)=>{const o=D.orders[id];await run(async()=>{await W.upd('orders/'+id,patch);if(art)await W.upd('artworks/'+o.artworkId,{status:art});await log('Finance',msg+' '+o.no,o.status,patch.status)},okMsg)};
ACT.oConvert=d=>{const o=D.orders[d.id],c=cfg(),pr=(D.artworks[o.artworkId]||{}).price||o.price;
  return O(d.id,{status:'paid',paidAt:new Date().toISOString(),price:pr,rates:c.split,splits:{artist:Math.round(pr*c.split.artist)/100,venue:Math.round(pr*c.split.venue)/100,platform:Math.round(pr*c.split.platform)/100}},'Reservation converted to sale',L('Marked as sold.','سُجّل مبيعًا.'),'sold')};
ACT.oRelease=d=>O(d.id,{status:'expired'},'Reservation released',L('Hold released.','أُفرج عن الحجز.'),'placed');
ACT.oHand=d=>O(d.id,{status:'handed',handoverAt:new Date().toISOString()},'Handover confirmed',L('Handover recorded. The return window has started.','سُجّل التسليم. بدأت فترة الإرجاع.'));
ACT.oSettle=d=>O(d.id,{status:'settled',settledAt:new Date().toISOString()},d.early?'Settled early (demo)':'Order settled',L('Settled. The split is ready for payout.','سُوّي الطلب. الحصص جاهزة للدفع.'));
ACT.oRefund=d=>{const o=D.orders[d.id],p=D.placements[o.placementId];return O(d.id,{status:'refunded',refundedAt:new Date().toISOString()},'Refunded',L('Refunded. The work returns to the wall.','تم الاسترداد. يعود العمل إلى الجدار.'),p&&activeP(p)?'placed':'available')};

/* ----- payouts ----- */
function mPay(){
  const bal=unpaidBalances().sort((a,b)=>b.amount-a.amount),pays=E(D.payouts).sort((a,b)=>String(b.paidAt).localeCompare(String(a.paidAt)));
  const inWindow=E(D.orders).filter(o=>['paid','handed'].includes(o.status)).reduce((n,o)=>n+((o.splits||{}).artist||0)+((o.splits||{}).venue||0),0);
  const nameOf=(t,id)=>t==='artist'?pick((D.artists[id]||{}).name):pick((D.venues[id]||{}).name);
  return title(L('Finance','المالية'),L('Payouts','الدفعات'),L('Make the bank transfer first, then record it here. Recording marks the orders as paid out and writes the audit log.','نفّذ التحويل البنكي أولًا ثم سجّله هنا. التسجيل يضع الطلبات كمدفوعة ويكتب سجل التدقيق.'))+
  `<div class="kpis"><div class="kpi"><b>${nf(bal.reduce((n,b)=>n+b.amount,0))}</b><span>${L('JOD ready to pay out','دينار جاهز للدفع')}</span></div><div class="kpi"><b>${nf(inWindow)}</b><span>${L('JOD still in the return window','دينار ضمن فترة الإرجاع')}</span></div></div>
  <h3 class="hd">${L('Ready to pay','جاهز للدفع')}</h3>
  ${bal.length?`<div class="scroll"><table><thead><tr><th>${L('Payee','المستفيد')}</th><th>${L('Type','النوع')}</th><th class="n">${L('Orders','الطلبات')}</th><th class="n">JOD</th><th></th></tr></thead><tbody>${bal.map(b=>`<tr><td><b>${esc(nameOf(b.type,b.id))}</b>${b.type==='artist'&&!(D.artists[b.id]||{}).bank?`<br>${chip('warn',L('No payout account','لا حساب دفع'))}`:''}</td><td>${b.type==='artist'?L('Artist','فنان'):L('Venue','مكان')}</td><td class="n">${b.orders.length}</td><td class="n">${nf(b.amount)}</td><td><button class="btn sm" data-act="payOut" data-type="${b.type}" data-id="${b.id}">${L('Record payout','سجّل الدفعة')}</button></td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">${L('Nothing is waiting for payout.','لا شيء بانتظار الدفع.')}</p>`}
  <h3 class="hd">${L('History','السجل')}</h3>
  ${pays.length?`<div class="scroll"><table><thead><tr><th>${L('Reference','المرجع')}</th><th>${L('Payee','المستفيد')}</th><th>${L('Date','التاريخ')}</th><th class="n">JOD</th></tr></thead><tbody>${pays.map(p=>`<tr><td class="mono">${esc(p.ref)}</td><td>${esc(nameOf(p.partyType,p.partyId))}</td><td>${fd(p.paidAt)}</td><td class="n">${nf(p.amount)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">${L('No payouts recorded.','لا دفعات مسجّلة.')}</p>`}`;
}
ACT.payOut=async d=>{
  const b=unpaidBalances().find(x=>x.type===d.type&&x.id===d.id);if(!b)return;
  const nums=E(D.payouts).map(x=>parseInt(String(x.ref).split('-').pop(),10)||0),ref='PO-2026-'+String(Math.max(0,...nums)+1).padStart(4,'0');
  const pid=W.id('payouts');
  await run(async()=>{
    await W.set('payouts/'+pid,{ref,partyType:b.type,partyId:b.id,amount:Math.round(b.amount*100)/100,currency:'JOD',orderIds:b.orders,paidAt:new Date().toISOString(),method:'Bank transfer (recorded)'});
    for(const oid of b.orders)await W.upd('orders/'+oid,{paidOut:{[b.type]:pid}});
    await log('Finance','Payout recorded '+ref+' to '+(b.type==='artist'?pick((D.artists[b.id]||{}).name):pick((D.venues[b.id]||{}).name)),'',moneyT(b.amount));
  },L('Payout recorded.','سُجّلت الدفعة.'));
};

/* ----- settings ----- */
function mSettings(){
  const c=cfg();
  return title(L('System','النظام'),L('Settings','الإعدادات'),L('Rates apply to new sales only. Past orders keep the rates they were sold at.','تسري النسب على المبيعات الجديدة فقط. تحتفظ الطلبات السابقة بنسبها.'))+
  `<form class="card" data-form="settings" novalidate><h3>${L('Revenue split','تقسيم الإيراد')}</h3>
  <div class="cols"><div class="f"><label for="s-a">${L('Artist %','الفنان %')}</label><input id="s-a" name="artist" type="number" value="${c.split.artist}"></div><div class="f"><label for="s-v">${L('Venue %','المكان %')}</label><input id="s-v" name="venue" type="number" value="${c.split.venue}"></div><div class="f"><label for="s-p">${L('The Wall %','The Wall %')}</label><input id="s-p" name="platform" type="number" value="${c.split.platform}"></div></div>
  <h3>${L('Rules','القواعد')}</h3>
  <div class="cols"><div class="f"><label for="s-r">${L('Return window (days)','فترة الإرجاع (أيام)')}</label><input id="s-r" name="returnDays" type="number" value="${c.returnDays}"></div><div class="f"><label for="s-h">${L('Reserve hold (hours)','مدة الحجز (ساعات)')}</label><input id="s-h" name="holdHours" type="number" value="${c.holdHours}"></div><div class="f"><label for="s-t">${L('Sales tax included in price (%)','ضريبة المبيعات ضمن السعر (%)')}</label><input id="s-t" name="taxRate" type="number" value="${c.taxRate}"></div></div>
  <p class="faint">${L('The tax rate is a placeholder. Confirm the rate and invoice rules with your accountant before launch.','نسبة الضريبة افتراضية. أكّد النسبة وقواعد الفواتير مع المحاسب قبل الإطلاق.')}</p>
  <p class="err" id="s-err" role="alert" hidden></p><div><button class="btn">${L('Save settings','احفظ الإعدادات')}</button></div></form>
  <div class="card"><h3>${L('Markets','الأسواق')}</h3><ul class="ticks"><li>${L('Jordan, JOD: live in the pilot.','الأردن، دينار: مفعّل في المرحلة التجريبية.')}</li><li>${L('UAE, AED: planned for Year 2 with a UAE gateway.','الإمارات، درهم: مخطط له في السنة الثانية مع بوابة دفع إماراتية.')}</li><li>${L('Saudi Arabia, SAR: planned for Year 3 with mada and data residency.','السعودية، ريال: مخطط له في السنة الثالثة مع مدى وإقامة البيانات.')}</li></ul></div>`;
}
ACT['form:settings']=async(f)=>{
  const n=k=>+f.get(k),er=$('#s-err'),split={artist:n('artist'),venue:n('venue'),platform:n('platform')};
  if(split.artist+split.venue+split.platform!==100){er.textContent=L('The three shares must add up to 100%. Now: '+(split.artist+split.venue+split.platform)+'%.','يجب أن يكون مجموع الحصص 100%. المجموع الآن: '+(split.artist+split.venue+split.platform)+'%.');er.hidden=false;return}
  if(!(n('returnDays')>=0&&n('holdHours')>0&&n('taxRate')>=0)){er.textContent=L('Check the rules: days, hours and tax must be positive numbers.','راجع القواعد: يجب أن تكون الأيام والساعات والضريبة أرقامًا موجبة.');er.hidden=false;return}
  const old=cfg(),next=Object.assign({},old,{split,returnDays:n('returnDays'),holdHours:n('holdHours'),taxRate:n('taxRate')});
  await run(async()=>{await W.set('settings/main',next);await log('Super admin','Settings changed',old.split.artist+'/'+old.split.venue+'/'+old.split.platform+' · '+old.returnDays+'d',split.artist+'/'+split.venue+'/'+split.platform+' · '+next.returnDays+'d')},L('Settings saved.','حُفظت الإعدادات.'));
};

/* ----- audit ----- */
function mAudit(){
  const rows=E(D.audit).sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,80);
  return title(L('System','النظام'),L('Audit log','سجل التدقيق'),L('Every price, payout, decision and setting change, with who and when.','كل تغيير في الأسعار والدفعات والقرارات والإعدادات، مع الفاعل والوقت.'))+
  `<div class="scroll"><table><thead><tr><th>${L('When','متى')}</th><th>${L('Who','من')}</th><th>${L('What','ماذا')}</th><th>${L('Before','قبل')}</th><th>${L('After','بعد')}</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="mono" style="white-space:nowrap">${ft(r.at)}</td><td>${esc(r.actor)}</td><td>${esc(r.action)}</td><td class="faint">${esc(r.before)}</td><td>${esc(r.after)}</td></tr>`).join('')}</tbody></table></div>`;
}

boot();
})();

</script>

<div style="position:fixed;inset-inline-start:10px;bottom:2px;font:11px system-ui;color:#8a8478;z-index:5;pointer-events:none">Demo: changes reset on reload</div>
</body></html>
