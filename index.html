<!doctype html>
<html lang="en"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202020">
    <meta name="description" content="Firas Al Otaibi — media, AI, and business. Full site coming soon.">
    <title>Firas Al Otaibi — Coming Soon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("fotaibi-theme") || "dark";
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #202020;
        --ink: #f1f0ee;
        --muted: #b9b8b5;
        --line: #3b3b3a;
        --pad: clamp(1.5rem, 4.5vw, 4.25rem);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #efeeeb;
        --ink: #202020;
        --muted: #5d5c59;
        --line: #cfceca;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100svh;
        color: var(--ink);
        font-family: "Archivo", sans-serif;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        color: var(--bg);
        background: var(--ink);
      }

      .page {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .masthead {
        min-height: clamp(6.5rem, 14vh, 9rem);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-inline: var(--pad);
        border-bottom: 1px solid var(--line);
      }

      .mark {
        color: var(--ink);
        font-size: clamp(1.75rem, 3vw, 2.5rem);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        text-decoration: none;
      }

      .theme-toggle {
        width: 2.75rem;
        height: 2.75rem;
        display: grid;
        place-items: center;
        padding: 0;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
        transition:
          color 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      .theme-toggle:hover {
        color: var(--bg);
        background: var(--ink);
        border-color: var(--ink);
      }

      .theme-toggle:active {
        transform: scale(0.94);
      }

      .theme-toggle:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
      }

      .theme-toggle svg {
        width: 1rem;
        height: 1rem;
      }

      main {
        display: flex;
        align-items: center;
        padding: clamp(4rem, 10vh, 8rem) var(--pad);
      }

      .hero {
        width: min(100%, 76rem);
      }

      .field {
        margin: 0 0 clamp(2.25rem, 5vh, 4.5rem);
        color: var(--muted);
        font-size: clamp(0.88rem, 1.6vw, 1.15rem);
        font-weight: 500;
        letter-spacing: 0.28em;
        line-height: 1.4;
      }

      h1 {
        margin: 0;
        max-width: 8.5ch;
        font-size: clamp(4rem, 10.4vw, 9.75rem);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 0.91;
        text-wrap: balance;
      }

      h1 span {
        display: block;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 2rem;
        padding: 0 var(--pad) clamp(1.75rem, 4vw, 3.5rem);
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .footer p {
        margin: 0;
      }

      @media (prefers-reduced-motion: no-preference) {
        .field,
        h1 span,
        .footer {
          animation: reveal 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        h1 span:nth-child(1) {
          animation-delay: 80ms;
        }

        h1 span:nth-child(2) {
          animation-delay: 140ms;
        }

        h1 span:nth-child(3) {
          animation-delay: 200ms;
        }

        .footer {
          animation-delay: 280ms;
        }
      }

      @keyframes reveal {
        from {
          opacity: 0;
          filter: blur(8px);
          transform: translateY(1.25rem);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .masthead {
          min-height: 6rem;
        }

        main {
          align-items: start;
          padding-top: clamp(4.5rem, 12vh, 7rem);
        }

        .field {
          max-width: 18rem;
          letter-spacing: 0.2em;
        }

        h1 {
          font-size: clamp(3.55rem, 19vw, 5.5rem);
          line-height: 0.92;
        }

        .footer {
          align-items: start;
          flex-direction: column;
          gap: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <a class="mark" href="/" aria-label="Firas Al Otaibi home">F/O</a>
        <button class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 18h6M10 22h4M8.2 14.7A7 7 0 1 1 15.8 14.7C14.7 15.5 14 16.3 14 18h-4c0-1.7-.7-2.5-1.8-3.3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </header>

      <main>
        <section class="hero" aria-labelledby="statement">
          <p class="field">MEDIA × AI × BUSINESS</p>
          <h1 id="statement">
            <span>BUILD.</span>
            <span>BREAK.</span>
            <span>REBUILD.</span>
          </h1>
        </section>
      </main>

      <footer class="footer">
        <p>Firas Al Otaibi</p>
        <p>Full site coming soon.</p>
      </footer>
    </div>
    <script>
      const toggle = document.querySelector(".theme-toggle");

      function syncToggle() {
        const nextTheme =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        const label = `Switch to ${nextTheme} mode`;
        toggle.setAttribute("aria-label", label);
        toggle.setAttribute("title", label);
      }

      toggle.addEventListener("click", () => {
        const nextTheme =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        localStorage.setItem("fotaibi-theme", nextTheme);
        syncToggle();
      });

      syncToggle();
    </script>
  

</body></html>
