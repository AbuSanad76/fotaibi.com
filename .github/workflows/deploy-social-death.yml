name: Deploy Social Death dashboard

on:
  push:
    branches: [main]
    paths:
      - "Social_Death/**"
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: "Optional release SHA-256 (leave blank to use release.json)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: social-death-production
  cancel-in-progress: false

env:
  LIVE_URL: https://social-death-dashboard.fotaibi.workers.dev
  VERIFY_USERNAME: fotaibi@gmail.com
  WRANGLER_VERSION: 4.154.0
  PLAYWRIGHT_VERSION: 1.56.1

jobs:
  verify-and-deploy:
    name: Verify, deploy, and confirm
    # Playwright 1.56 does not support the newer Ubuntu 26 runner image yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned deployment tools
        run: npm install --prefix cloudflare-social-death --no-audit --no-fund

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Chromium
        run: npx --prefix cloudflare-social-death playwright install --with-deps chromium

      - name: Verify release files and media manifest
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: node .github/scripts/verify-social-death-release.mjs

      - name: Browser-check the packaged dashboard
        run: node .github/scripts/browser-check-social-death.mjs

      - name: Record previous deployment
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DASHBOARD_VERIFY_PASSWORD: ${{ secrets.DASHBOARD_VERIFY_PASSWORD }}
        run: bash .github/scripts/record-previous-social-death.sh

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --prefix cloudflare-social-death wrangler deploy
          --config cloudflare-social-death/wrangler.jsonc
          --message "GitHub Actions ${GITHUB_SHA}"

      - name: Verify protected live release
        env:
          DASHBOARD_VERIFY_PASSWORD: ${{ secrets.DASHBOARD_VERIFY_PASSWORD }}
        run: bash .github/scripts/verify-live-social-death.sh

      - name: Roll back if live verification failed
        if: failure() && steps.deploy.outcome == 'success' && steps.previous.outputs.version_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.version_id }}
        run: >-
          npx --prefix cloudflare-social-death wrangler rollback
          "${PREVIOUS_VERSION_ID}"
          --config cloudflare-social-death/wrangler.jsonc
          --message "Automatic rollback after failed live verification"

